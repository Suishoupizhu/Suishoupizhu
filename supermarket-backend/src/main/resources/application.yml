server:
  port: 8080
spring:
  datasource:
    url: jdbc:h2:mem:supermarket;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
app:
  jwt:
    secret: super-secret-change-me-please-32-bytes-minimum-123456
    expMinutes: 240
logging:
  level:
    org.hibernate.SQL: debug